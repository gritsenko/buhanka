<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="Дорога на восток — текстовая игра на выживание, прототип для ESP32 LilyGO T-Display">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:url" content="https://gritsenko.biz/buhanka/">
    <meta property="og:title" content="Дорога на восток — T-Display">
    <meta property="og:description" content="Дорога на восток — текстовая игра на выживание, прототип для ESP32 LilyGO T-Display">
    <meta property="og:image" content="https://gritsenko.biz/buhanka/og/cover.jpg">
    <meta property="og:image:alt" content="Обложка игры Дорога на восток">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Дорога на восток — T-Display">
    <meta name="twitter:description" content="Дорога на восток — текстовая игра на выживание, прототип для ESP32 LilyGO T-Display">
    <meta name="twitter:image" content="https://gritsenko.biz/buhanka/og/cover.jpg">
    <title>Дорога на восток — T-Display</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="device">
        <div class="screen" id="screen">

            <!-- Оверлей Статуса и Подсказки -->
            <div class="overlay" id="status-overlay" title="Нажмите, чтобы закрыть">
                <div class="status-header">=== СОСТОЯНИЕ ГРУППЫ ===</div>
                <div class="status-text" id="status-text-content"></div>
                <div class="hint-text" id="hint-text-content"></div>
            </div>

            <!-- Оверлей Карты -->
            <div class="overlay" id="map-overlay" title="Нажмите, чтобы закрыть">
                <div class="status-header">=== КАРТА МАРШРУТА ===</div>
                <div class="map-text" id="map-text-content">
[МСК] --- [ОКА] --- [УРАЛ] ... [НАХОДКА]
            <span class="map-marker">▲</span>
         <span class="map-marker">ВЫ ЗДЕСЬ</span>
                </div>
            </div>

            <!-- Экран анимации (пиксель-арт сцена) -->
            <!--
                Между событиями игра рисует сцену: фон, дальние горы,
                деревья/кусты на параллаксе, дорогу-прямоугольник и
                анимированного героя. Состав описан в data/scenes.json.
                Внутреннее разрешение канваса фиксировано (см. SCENE_W/H
                в js/app.js), CSS лишь масштабирует под ~85% экрана.
            -->
            <div class="overlay animation-screen" id="animation-screen">
                <canvas class="scene-canvas" id="scene-canvas" width="204" height="115"></canvas>
                <div class="result-card" id="result-card" hidden>
                    <div class="result-title" id="result-title-content"></div>
                    <div class="result-text" id="result-text-content"></div>
                    <div class="result-continue" id="result-continue-content"></div>
                </div>
            </div>

            <!-- Стандартный UI -->
            <div class="top-bar">
                <div class="resource">
                    <span>🍗</span>
                    <div class="bar-container"><div class="bar-fill" id="food-bar" style="background-color: var(--food-color); width: 100%;"></div></div>
                </div>
                <div class="resource" id="fuel-container" style="opacity: 0.3;">
                    <span>⛽</span>
                    <div class="bar-container"><div class="bar-fill" id="fuel-bar" style="background-color: var(--fuel-color); width: 0%;"></div></div>
                </div>
                <div class="map-touch-btn" id="map-touch-btn" title="Карта">🗺️</div>
            </div>

            <div class="main-area">
                <div class="party-panel" id="party-panel" title="Информация и подсказки"></div>
                <div class="content-panel">
                    <div class="text-area" id="text-area">Загрузка...</div>
                    <div class="choices-area" id="choices-area"></div>
                </div>
            </div>
        </div>

        <div class="hardware-buttons">
            <div class="btn" id="btn-top">ВЫБОР<br><small>(Удерж: Инфо)</small></div>
            <div class="btn" id="btn-bottom">ОК<br><small>(Удерж: Карта)</small></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
