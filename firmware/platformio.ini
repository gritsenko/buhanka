; PlatformIO project for "Road East" hardware clients.
;
; Layout:
;   src/<device_id>/    — entry point and platform-specific code per device.
;   src/common/         — code shared across all device clients (added when
;                          there is something to share; currently unused).
;   include/            — public headers visible to every environment.
;   boards/             — custom PlatformIO board manifests.
;
; Adding a new device:
;   1. Drop its sources into src/<new_device>/.
;   2. Add a new [env:<new_device>] section below and set its build_src_filter
;      to include +<common/**> +<<new_device>/**>.
;   3. Optionally place a custom board manifest in boards/.

[platformio]
default_envs = lilygo-t-display
boards_dir = boards

[common]
framework = arduino
upload_speed = 460800
monitor_speed = 115200

; LilyGO TTGO T-Display v1.1 — 135x240 ST7789 TFT, two buttons (GPIO 0, GPIO 35).
[env:lilygo-t-display]
extends = common
platform = espressif32
board = lilygo-t-display-v11
build_src_filter =
    -<*>
    +<common/**>
    +<lilygo_tdisplay/**>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
; The generated asset tables use inline constexpr variables (C++17); the
; Arduino core still defaults to gnu++11.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; src/common/ holds the portable game + renderer; device code includes its
    ; headers by bare name.
    -Isrc/common
    -DROAD_EAST_DEVICE_LILYGO_TDISPLAY=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
